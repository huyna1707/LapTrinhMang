<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabulary Learning - English Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#6366f1",
            secondary: "#8b5cf6",
            accent: "#06b6d4",
            success: "#10b981",
            warning: "#f59e0b",
            danger: "#ef4444",
          },
        },
      },
    };
  </script>
  <style>
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .card-hover {
      transition: all 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }
    .correct-answer {
      background-color: #dcfce7;
      border-color: #16a34a;
    }
    .wrong-answer {
      background-color: #fef2f2;
      border-color: #dc2626;
    }
  </style>
</head>
<body class="bg-gray-50 font-sans">
<div class="flex h-screen">
  <!-- Left Sidebar -->
  <div class="w-64 gradient-bg text-white shadow-2xl">
    <div class="p-6">
      <div class="flex items-center space-x-3 mb-8">
        <div
                class="w-10 h-10 bg-white rounded-lg flex items-center justify-center"
        >
          <span class="text-2xl">📚</span>
        </div>
        <h1 class="text-xl font-bold">English Hub</h1>
      </div>

      <nav class="space-y-2">
        <a
                href="#"
                class="flex items-center space-x-3 p-3 rounded-lg hover:bg-white hover:bg-opacity-20 transition-all"
        >
          <span class="text-lg">🏠</span>
          <span>Dashboard</span>
        </a>
        <a
                href="#"
                class="flex items-center space-x-3 p-3 rounded-lg bg-white bg-opacity-20 hover:bg-opacity-30 transition-all"
        >
          <span class="text-lg">📝</span>
          <span>Vocabulary</span>
        </a>
        <a
                href="#"
                class="flex items-center space-x-3 p-3 rounded-lg hover:bg-white hover:bg-opacity-20 transition-all"
        >
          <span class="text-lg">📖</span>
          <span>Reading</span>
        </a>
        <a
                href="#"
                class="flex items-center space-x-3 p-3 rounded-lg hover:bg-white hover:bg-opacity-20 transition-all"
        >
          <span class="text-lg">🔄</span>
          <span>Translate</span>
        </a>
        <a
                href="#"
                class="flex items-center space-x-3 p-3 rounded-lg hover:bg-white hover:bg-opacity-20 transition-all"
        >
          <span class="text-lg">⚡</span>
          <span>Grammar</span>
        </a>
        <a
                href="#"
                class="flex items-center space-x-3 p-3 rounded-lg hover:bg-white hover:bg-opacity-20 transition-all"
        >
          <span class="text-lg">⚙️</span>
          <span>Cài đặt</span>
        </a>
      </nav>
    </div>

    <div class="absolute bottom-6 left-6 right-6">
      <div class="bg-white bg-opacity-20 rounded-lg p-4">
        <div class="flex items-center space-x-3">
          <div
                  class="w-10 h-10 bg-white rounded-full flex items-center justify-center"
          >
            <span class="text-lg">👤</span>
          </div>
          <div>
            <p class="font-semibold">Học viên</p>
            <p class="text-sm opacity-80">Level: Intermediate</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col">
    <!-- Top Navbar -->
    <nav class="bg-white shadow-sm border-b border-gray-200 px-6 py-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-2xl font-bold text-gray-800">
            Vocabulary Practice
          </h2>
          <p class="text-gray-600">
            Luyện tập từ vựng cấp độ
            <span
                    th:text="${selectedLevel}"
                    class="font-semibold text-blue-600"
            >A1</span
            >
            - Hãy nhập nghĩa tiếng Việt của các từ sau
          </p>
        </div>
        <div class="flex items-center space-x-4">
          <div class="bg-blue-100 px-4 py-2 rounded-lg">
                <span class="text-blue-800 font-semibold"
                >Điểm: <span id="score">0</span>/<span
                        id="total"
                        th:text="${#lists.size(vocabularies)}"
                >30</span
                ></span
                >
          </div>
          <div class="bg-green-100 px-4 py-2 rounded-lg">
                <span class="text-green-800 font-semibold"
                >Đúng: <span id="correct">0</span></span
                >
          </div>
          <button
                  class="p-2 rounded-lg hover:bg-gray-100 transition-colors"
          >
            <span class="text-xl">🔔</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 p-6 overflow-auto">
      <div class="max-w-4xl mx-auto">
        <!-- Progress Bar -->
        <div class="mb-6">
          <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-medium text-gray-700"
                >Tiến độ hoàn thành</span
                >
            <span class="text-sm font-medium text-gray-700"
            ><span id="progress">0</span>/<span
                    th:text="${#lists.size(vocabularies)}"
            >30</span
            ></span
            >
          </div>
          <div class="w-full bg-gray-200 rounded-full h-2">
            <div
                    id="progressBar"
                    class="bg-blue-600 h-2 rounded-full transition-all duration-300"
                    style="width: 0%"
            ></div>
          </div>
        </div>

        <!-- Vocabulary Cards -->
        <div class="space-y-4" id="vocabularyContainer">
          <!-- Hiển thị trực tiếp từ Thymeleaf -->
          <th:block th:each="vocab,iterStat : ${vocabularies}">
            <div class="card-hover bg-white rounded-xl p-6 shadow-sm border border-gray-200">
              <div class="flex items-center justify-between">
                <div class="flex-1">
                  <div class="flex items-center space-x-4 mb-4">
                    <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center font-bold text-blue-600" th:text="${iterStat.index + 1}">
                      1
                    </div>
                    <div>
                      <h3 class="text-xl font-bold text-gray-800" th:text="${vocab.word}">Word</h3>
                      <p class="text-gray-500 text-sm" th:text="${vocab.phonetic}">Pronunciation</p>
                    </div>
                  </div>
                </div>
                <div class="flex items-center space-x-4">
                  <div class="flex-1">
                    <input
                      type="text"
                      th:id="'answer-' + ${iterStat.index}"
                      placeholder="Nhập nghĩa tiếng Việt..."
                      class="w-64 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                      th:onkeypress="'handleEnter(event, ' + ${iterStat.index} + ')'"
                    >
                  </div>
                  <button
                    th:onclick="'submitAnswer(' + ${iterStat.index} + ')'"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-semibold transition-all duration-200 transform hover:scale-105"
                  >
                    Kiểm tra
                  </button>
                </div>
              </div>
              <div th:id="'result-' + ${iterStat.index}" class="mt-4 hidden">
                <!-- Result will be shown here -->
              </div>
              <!-- Hidden data for JavaScript -->
              <input type="hidden" th:id="'correct-' + ${iterStat.index}" th:value="${vocab.meaning}">
            </div>
          </th:block>
        </div>

        <!-- Submit All Button -->
        <div class="mt-8 text-center">
          <button
                  onclick="submitAll()"
                  class="bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-3 px-8 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg"
          >
            Nộp tất cả đáp án 🚀
          </button>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
  // Đơn giản hóa JavaScript để làm việc trực tiếp với DOM
  let userAnswers = {};
  let correctCount = 0;
  let totalWords = /*[[${#lists.size(vocabularies)}]]*/ 0;
  
  console.log("📊 Tổng số từ vựng:", totalWords);

  function handleEnter(event, index) {
    if (event.key === "Enter") {
      submitAnswer(index);
    }
  }

  function submitAnswer(index) {
    const input = document.getElementById(`answer-${index}`);
    const resultDiv = document.getElementById(`result-${index}`);
    const correctAnswerInput = document.getElementById(`correct-${index}`);
    
    if (!input || !resultDiv || !correctAnswerInput) {
      console.error("Không tìm thấy elements cho index:", index);
      return;
    }
    
    const userAnswer = input.value.trim().toLowerCase();
    const correctAnswer = correctAnswerInput.value.toLowerCase();

    if (!userAnswer) {
      showNotification("Vui lòng nhập đáp án!", "warning");
      return;
    }

    // Check if answer is correct (allow partial matches)
    const isCorrect = correctAnswer.includes(userAnswer) || userAnswer.includes(correctAnswer.split(",")[0].trim());

    userAnswers[index] = {
      userAnswer: input.value,
      isCorrect: isCorrect,
    };

    // Update input styling
    input.className = input.className.replace(/correct-answer|wrong-answer/g, "");
    input.className += isCorrect ? " correct-answer" : " wrong-answer";
    input.disabled = true;

    // Show result
    resultDiv.className = "mt-4 p-3 rounded-lg";
    if (isCorrect) {
      resultDiv.className += " bg-green-50 border border-green-200";
      resultDiv.innerHTML = `
            <div class="flex items-center space-x-2">
              <span class="text-green-600 text-lg">✅</span>
              <span class="text-green-800 font-semibold">Chính xác!</span>
            </div>
          `;
      correctCount++;
    } else {
      resultDiv.className += " bg-red-50 border border-red-200";
      resultDiv.innerHTML = `
            <div class="flex items-center space-x-2">
              <span class="text-red-600 text-lg">❌</span>
              <span class="text-red-800 font-semibold">Sai rồi! Đáp án đúng: <strong>${correctAnswerInput.value}</strong></span>
            </div>
          `;
    }
    resultDiv.classList.remove("hidden");

    // Update progress
    updateProgress();

    // Disable submit button
    const button = input.parentElement.nextElementSibling.querySelector('button');
    if (button) {
      button.disabled = true;
      button.className = "bg-gray-400 text-white px-6 py-2 rounded-lg font-semibold cursor-not-allowed";
      button.textContent = "Đã kiểm tra";
    }
  }

  function updateProgress() {
    const answered = Object.keys(userAnswers).length;
    const progressPercent = totalWords > 0 ? (answered / totalWords) * 100 : 0;

    const progressElement = document.getElementById("progress");
    const progressBarElement = document.getElementById("progressBar");
    const scoreElement = document.getElementById("score");
    const correctElement = document.getElementById("correct");
    const totalElement = document.getElementById("total");

    if (progressElement) progressElement.textContent = answered;
    if (progressBarElement) progressBarElement.style.width = `${progressPercent}%`;
    if (scoreElement) scoreElement.textContent = correctCount;
    if (correctElement) correctElement.textContent = correctCount;
    if (totalElement) totalElement.textContent = totalWords;
    
    console.log(`📈 Cập nhật tiến độ: ${answered}/${totalWords} câu, ${correctCount} đúng`);
  }

  function submitAll() {
    console.log("🚀 Bắt đầu submit tất cả đáp án...");
    
    // Reset correctCount để tính lại từ đầu
    correctCount = 0;
    
    // Submit tất cả các câu trả lời
    for (let i = 0; i < totalWords; i++) {
      const input = document.getElementById(`answer-${i}`);
      
      if (input && !input.disabled) {
        // Nếu chưa submit và có input, submit ngay
        if (input.value.trim()) {
          submitAnswerSilent(i);
        } else {
          // Nếu không có đáp án, mark as incorrect
          markAsIncorrect(i);
        }
      }
    }
    
    console.log(`📊 Kết quả cuối: ${correctCount}/${totalWords} câu đúng`);
    
    // Hiển thị kết quả cuối cùng
    setTimeout(() => {
      showFinalResults();
    }, 500);
  }

  // Function submit âm thầm không hiển thị notification
  function submitAnswerSilent(index) {
    const input = document.getElementById(`answer-${index}`);
    const resultDiv = document.getElementById(`result-${index}`);
    const correctAnswerInput = document.getElementById(`correct-${index}`);
    
    if (!input || !resultDiv || !correctAnswerInput) {
      console.error("Không tìm thấy elements cho index:", index);
      return;
    }
    
    const userAnswer = input.value.trim().toLowerCase();
    const correctAnswer = correctAnswerInput.value.toLowerCase();

    // Check if answer is correct (allow partial matches)
    const isCorrect = correctAnswer.includes(userAnswer) || userAnswer.includes(correctAnswer.split(",")[0].trim());

    userAnswers[index] = {
      userAnswer: input.value,
      isCorrect: isCorrect,
    };

    // Update input styling
    input.className = input.className.replace(/correct-answer|wrong-answer/g, "");
    input.className += isCorrect ? " correct-answer" : " wrong-answer";
    input.disabled = true;

    // Show result
    resultDiv.className = "mt-4 p-3 rounded-lg";
    if (isCorrect) {
      resultDiv.className += " bg-green-50 border border-green-200";
      resultDiv.innerHTML = `
            <div class="flex items-center space-x-2">
              <span class="text-green-600 text-lg">✅</span>
              <span class="text-green-800 font-semibold">Chính xác!</span>
            </div>
          `;
      correctCount++;
    } else {
      resultDiv.className += " bg-red-50 border border-red-200";
      resultDiv.innerHTML = `
            <div class="flex items-center space-x-2">
              <span class="text-red-600 text-lg">❌</span>
              <span class="text-red-800 font-semibold">Sai rồi! Đáp án đúng: <strong>${correctAnswerInput.value}</strong></span>
            </div>
          `;
    }
    resultDiv.classList.remove("hidden");

    // Disable submit button
    const button = input.parentElement.nextElementSibling.querySelector('button');
    if (button) {
      button.disabled = true;
      button.className = "bg-gray-400 text-white px-6 py-2 rounded-lg font-semibold cursor-not-allowed";
      button.textContent = "Đã kiểm tra";
    }
  }

  // Function để mark câu trả lời trống là sai
  function markAsIncorrect(index) {
    const input = document.getElementById(`answer-${index}`);
    const resultDiv = document.getElementById(`result-${index}`);
    const correctAnswerInput = document.getElementById(`correct-${index}`);
    
    if (!input || !resultDiv || !correctAnswerInput) {
      return;
    }

    userAnswers[index] = {
      userAnswer: "",
      isCorrect: false,
    };

    // Update input styling
    input.className = input.className.replace(/correct-answer|wrong-answer/g, "");
    input.className += " wrong-answer";
    input.disabled = true;
    input.placeholder = "Chưa trả lời";

    // Show result
    resultDiv.className = "mt-4 p-3 rounded-lg bg-red-50 border border-red-200";
    resultDiv.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="text-red-600 text-lg">❌</span>
            <span class="text-red-800 font-semibold">Chưa trả lời! Đáp án đúng: <strong>${correctAnswerInput.value}</strong></span>
          </div>
        `;
    resultDiv.classList.remove("hidden");

    // Disable submit button
    const button = input.parentElement.nextElementSibling.querySelector('button');
    if (button) {
      button.disabled = true;
      button.className = "bg-gray-400 text-white px-6 py-2 rounded-lg font-semibold cursor-not-allowed";
      button.textContent = "Chưa trả lời";
    }
  }

  function showFinalResults() {
    // Cập nhật tiến độ cuối cùng
    updateProgress();
    
    const finalScore = correctCount;
    const percentage = totalWords > 0 ? Math.round((finalScore / totalWords) * 100) : 0;
    const wrongAnswers = totalWords - finalScore;

    let message = "";
    let emoji = "";

    if (percentage >= 90) {
      message = "Xuất sắc! Bạn đã thành thạo từ vựng này!";
      emoji = "🏆";
    } else if (percentage >= 70) {
      message = "Tốt lắm! Hãy tiếp tục luyện tập!";
      emoji = "🎉";
    } else if (percentage >= 50) {
      message = "Khá ổn! Bạn cần ôn lại một số từ!";
      emoji = "👍";
    } else {
      message = "Hãy cố gắng hơn! Ôn lại và thử lại nhé!";
      emoji = "💪";
    }

    const modal = document.createElement("div");
    modal.className = "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50";
    modal.innerHTML = `
          <div class="bg-white rounded-2xl p-8 max-w-md mx-4 text-center">
            <div class="text-6xl mb-4">${emoji}</div>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">Kết quả hoàn thành</h3>
            <div class="mb-4">
              <p class="text-4xl font-bold text-blue-600 mb-2">${finalScore}/${totalWords}</p>
              <div class="text-lg text-gray-600 space-y-1">
                <p>✅ Đúng: <span class="font-semibold text-green-600">${finalScore} câu</span></p>
                <p>❌ Sai: <span class="font-semibold text-red-600">${wrongAnswers} câu</span></p>
                <p>📊 Tỷ lệ: <span class="font-semibold text-blue-600">${percentage}%</span></p>
              </div>
            </div>
            <p class="text-lg text-gray-600 mb-6">${message}</p>
            <div class="flex space-x-4">
              <button onclick="location.reload()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg font-semibold transition-colors">
                Làm lại
              </button>
              <button onclick="window.location.href='/vocabulary-level'" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-lg font-semibold transition-colors">
                Chọn level khác
              </button>
              <button onclick="this.parentElement.parentElement.parentElement.remove()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-2 px-4 rounded-lg font-semibold transition-colors">
                Đóng
              </button>
            </div>
          </div>
        `;
    document.body.appendChild(modal);
    
    console.log(`🎯 Hiển thị kết quả cuối: ${finalScore}/${totalWords} (${percentage}%)`);
  }

  function showNotification(message, type = "info") {
    const colors = {
      success: "bg-green-500",
      warning: "bg-yellow-500",
      error: "bg-red-500",
      info: "bg-blue-500",
    };

    const notification = document.createElement("div");
    notification.className = `fixed top-4 right-4 ${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg z-50 transform translate-x-full transition-transform duration-300`;
    notification.textContent = message;

    document.body.appendChild(notification);

    setTimeout(() => {
      notification.style.transform = "translateX(0)";
    }, 100);

    setTimeout(() => {
      notification.style.transform = "translateX(100%)";
      setTimeout(() => {
        if (document.body.contains(notification)) {
          document.body.removeChild(notification);
        }
      }, 300);
    }, 3000);
  }

  // Initialize when DOM is loaded
  document.addEventListener("DOMContentLoaded", function () {
    console.log("✅ DOM loaded, vocabulary page ready!");
    updateProgress(); // Initialize progress display
  });
</script>
</body>
</html>
