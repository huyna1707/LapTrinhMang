<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi - English Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#6366f1",
                        secondary: "#8b5cf6",
                        accent: "#06b6d4",
                        success: "#10b981",
                        warning: "#f59e0b",
                        danger: "#ef4444",
                    },
                },
            },
        };
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
<div class="flex h-screen">
    <!-- Left Sidebar -->
    <div class="w-64 gradient-bg text-white shadow-2xl">
        <div class="p-6">
            <div class="flex items-center space-x-3 mb-8">
                <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center">
                    <span class="text-2xl">📚</span>
                </div>
                <h1 class="text-xl font-bold">English Hub</h1>
            </div>
            <nav class="space-y-2">
                <a href="/vocabulary-level" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-white hover:bg-opacity-20 transition-all">
                    <span class="text-lg">📝</span>
                    <span>Vocabulary</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col justify-center items-center p-6">
        <div class="bg-white rounded-xl p-8 shadow-lg max-w-md text-center">
            <h2 class="text-2xl font-bold text-red-600 mb-4">Đã có lỗi xảy ra</h2>
            <p class="text-gray-600 mb-6" th:text="${error}">Không thể lấy dữ liệu từ vựng.</p>
            <a href="/vocabulary-level" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-all">Quay lại chọn cấp độ</a>
        </div>
    </div>
</div>
</body>
</html>
